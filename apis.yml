apis:
- name: B12 Website Generator MCP Server
  description: >-
    B12's Model Context Protocol server, and the only machine-callable surface
    B12 publishes. It exposes a single tool, generate_website, which builds a
    website draft with AI from a business name, description, image keywords and
    subtitle, then returns a static preview image and a signup link to claim and
    edit the site. Two remote deployments run in parallel: mcp.b12.io/mcp serves
    Claude with an MCP-UI preview resource, and b12.io/mcp serves ChatGPT Apps.
    Both answer anonymously with no API key, token or OAuth challenge.
  humanURL: https://github.com/b12io/website-generator-mcp-server
  baseURL: https://mcp.b12.io/mcp
