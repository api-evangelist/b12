aid: b12
name: B12
description: >-
  B12 is an AI-powered website builder that generates professional websites,
  online stores, and web apps from a short prompt. Founded on a human-in-the-loop
  model and now driven by its B12 3.0 AI Agent (launched February 2026), the
  platform lets solopreneurs, consultants, freelancers, and growing teams
  describe a business idea and launch a site in minutes, then run that business
  online with built-in tools for SEO, online payments and invoicing, scheduling,
  email marketing, client intake, contact management, and contracts with
  eSignatures. B12 offers self-serve DIY plans as well as Expert plans where its
  design and content team handles setup and ongoing updates. Over 4 million
  websites have been built on B12. B12 exposes its website-generation capability
  to AI agents through a published Model Context Protocol (MCP) server, a Claude
  plugin, and a Website Generator GPT, but does not publish a general-purpose
  public REST API.
