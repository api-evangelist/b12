  evidence: >-
    tools/list returned 200; tool _meta carries openai/outputTemplate and
    openai/toolInvocation hints rather than the MCP-UI block
  file: b12-mcp-tools-chatgpt.json

transport_requirements:
  accept_header_required: application/json, text/event-stream
  note: >-
    mcp.b12.io/mcp rejects a request whose Accept header omits either media type
    with HTTP 406 and JSON-RPC -32600. A bare GET is also 406. See
    errors/b12-problem-types.yml.

tools:
- name: generate_website
  title: Generate Website
  description: >-
    Generate a website with AI from a project name and description. Returns a
    static preview image of the generated website and a link to claim and edit
    the site in a website editor outside of the conversation.
  input_schema:
    required: [name, description, image_keywords, subtitle]
    properties:
    - name: name
      type: string
      description: The name of the business.
    - name: description
      type: string
      description: The short description of the business in less than 1000 characters.
    - name: image_keywords
      type: string
      description: >-
        Word or short phrase to search the image on an image search engine that
        best suits the provided business name and description.
    - name: subtitle
      type: string
      description: >-
        The short and catchy subtitle for hero section of the website in less
        than 5-10 words.
  output_schema: object with result[] of MCP TextContent
  annotations:
    read_only_hint: false
    destructive_hint: false
    open_world_hint: false
    idempotent: false
  idempotency_note: >-
    Explicitly NOT idempotent by the provider's own tool description: "To create
    a separate, additional website, call the tool again." A retried call creates
    a second site. There is no idempotency key on this surface.
  source: live tools/list on https://mcp.b12.io/mcp
  verbatim: b12-mcp-tools.json

